[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-rag"
version = "0.1.0"
description = "Inspectable bilingual sparse retrieval, evidence citations, and honest offline evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2"]
license = "MIT"
authors = [{name = "Portfolio contributors"}]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
evidence-rag = "evidence_rag.cli:main"

[tool.setuptools.packages.find]
include = ["evidence_rag*"]

[tool.setuptools.package-data]
evidence_rag = ["data/*.json", "data/corpus/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
